<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  body {
    color: #fff;
    background: var(--param-base);
  }
  .glow-layer { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 85% at var(--param-glowX) 78%, var(--param-glow) 0%, transparent 70%); }
  .sw-live.param-breathe .glow-layer { animation: breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: 0.75; transform: scale(1); } to { opacity: 1; transform: scale(1.08); } }
  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 10vw;
  }
  .cover { width: 11vmin; height: 11vmin; border-radius: 0.5vmin; object-fit: cover; box-shadow: 0 1.5vmin 4vmin rgba(0, 0, 0, 0.4); margin-bottom: 9vmin; }
  .current { font-family: var(--param-font); font-size: var(--param-lyricSize); line-height: 1.3; max-width: 90vmin; }
  .tr { font-family: var(--param-font); font-size: calc(var(--param-lyricSize) * 0.58); line-height: 1.35; opacity: 0.6; margin-top: 1.2vmin; max-width: 90vmin; }
  .tr:empty { display: none; }
  .next { font-family: var(--param-monoFont); font-size: 1.7vmin; opacity: 0.42; margin-top: 2.8vmin; max-width: 90vmin; }
  wave-form { width: 26vmin; margin-top: 6vmin; color: rgba(255, 255, 255, 0.86); }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 7vmin; text-align: center;
    font-family: var(--param-monoFont); font-size: 1.4vmin; opacity: 0.48; letter-spacing: 0.04em;
  }
  .param-lowercase .foot { text-transform: lowercase; }
  .sw-grain { opacity: 0.14; }

  /* playback controls: quiet until you reach for them */
  .controls { display: flex; align-items: center; gap: 6vmin; margin-top: 5vmin; opacity: 0.4; transition: opacity 0.35s ease; }
  .controls:hover { opacity: 0.95; }
  .ctl { display: grid; place-items: center; width: 3vmin; height: 3vmin; color: #fff; }
  .ctl[data-control="playPause"] { width: 3.8vmin; height: 3.8vmin; }
  .ctl svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .ctl .i-play, .ctl .i-pause { display: none; }
  html:not(.is-playing) .ctl .i-play { display: block; }
  html.is-playing .ctl .i-pause { display: block; }
  .seek { width: 34vmin; margin-top: 4.5vmin; height: 0.35vmin; color: #fff; background: rgba(255, 255, 255, 0.26); opacity: 0.55; }
  .seek:hover { opacity: 1; }
</style>
</head>
<body>
  <div class="glow-layer"></div>
  <div class="stack">
    <img class="cover" data-src="track.cover" data-show="params.showCover" alt="">
    <div class="current" data-lyrics data-animate data-show="lyrics.hasLyrics" data-bind="lyrics.current|note"></div>
    <div class="tr" data-lyrics data-animate data-show="params.translations" data-bind="lyrics.translation"></div>
    <div class="current" data-show="!lyrics.hasLyrics" data-bind="track.title"></div>
    <div class="next" data-lyrics data-animate data-show="params.showNext" data-bind="lyrics.next1"></div>
    <wave-form bars="56" data-show="params.showWave"></wave-form>
    <progress-bar class="seek" data-control="seek" data-show="params.controls"></progress-bar>
    <div class="controls" data-show="params.controls">
      <div class="ctl" data-control="previous" role="button" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 5h2.6v14H6zM20 5v14L9.3 12z"/></svg>
      </div>
      <div class="ctl" data-control="playPause" role="button" aria-label="Play or pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.2v15.6L20 12z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.8 4.5h3.5v15H6.8zM13.7 4.5h3.5v15h-3.5z"/></svg>
      </div>
      <div class="ctl" data-control="next" role="button" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M15.4 5H18v14h-2.6zM4 5v14l10.7-7z"/></svg>
      </div>
    </div>
  </div>
  <div class="foot"><span data-bind="track.title"></span> &nbsp;—&nbsp; <span data-bind="track.artist"></span></div>
  <div class="sw-grain" data-show="params.grain"></div>
</body>
</html>
