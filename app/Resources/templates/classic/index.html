<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  /* The iPod is drawn in its own units: the body is 100u wide and 167.5u tall (61.8 × 103.5 mm), the screen 82u wide
     and 320 "iPod pixels" (--s) across, like the real 320×240 display. --ph is the body's height on screen. */
  :root { --ph: min(84vh, 52vw); --u: calc(var(--ph) / 167.5); --s: calc(var(--u) * 0.25625);
    --front-a: #e6e7e8; --front-b: #c8c9cb; --edge: #b9bbbe; --wheel-a: #f4f4f2; --wheel-b: #dcdcda;
    --button-a: #fafaf9; --button-b: #e2e2e0; --glyph: #a7a9ac; --wheel-line: rgba(0, 0, 0, 0.1); }
  body { background: #17131c; color: #fff; font-family: "Helvetica Neue", Helvetica, -apple-system, sans-serif; }

  /* ---------- the room: the cover, blurred once by the app, and a dim so the white type reads ---------- */
  .bg { position: absolute; inset: 0; background: #2a2433 center / cover no-repeat; transform: scale(1.08); }
  .shade { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 70% at 66% 45%, transparent 0, rgba(0, 0, 0, 0.28) 100%),
      linear-gradient(90deg, rgba(0, 0, 0, calc(var(--param-dim) + 0.12)), rgba(0, 0, 0, var(--param-dim)) 55%, rgba(0, 0, 0, calc(var(--param-dim) * 0.6))); }
  .sw-grain { opacity: 0.08; }

  .stage { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 118vh) auto; justify-content: center;
    align-items: center; column-gap: max(6vw, 7vh); padding: 0 8vw; }
  html:not(.param-side) .stage { grid-template-columns: auto; }
  html:not(.param-side) .side { display: none; }

  /* ---------- beside it: the song set big ---------- */
  .side { align-self: end; padding-bottom: calc((100vh - var(--ph)) / 2 + var(--u) * 14); min-width: 0; }
  .kicker { font: 600 max(1.15vmin, 11px) / 1 -apple-system, system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0.72; display: flex; align-items: center; gap: 1.1vmin; margin-bottom: 2.4vmin; }
  .kicker i { width: 0; height: 0; border-left: 1.05vmin solid currentColor; border-top: 0.62vmin solid transparent; border-bottom: 0.62vmin solid transparent; }
  .big { display: block; width: 100%; font-family: var(--param-font); font-weight: 700; line-height: 1.02; letter-spacing: -0.025em;
    text-shadow: 0 0.3vmin 3vmin rgba(0, 0, 0, 0.25); }
  .by { margin-top: 2.6vmin; font: 500 max(2.3vmin, 14px) / 1.3 var(--param-font); letter-spacing: -0.005em; }
  .by .al { opacity: 0.62; }
  .by div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- the iPod ---------- */
  .pod { position: relative; width: calc(var(--u) * 100); height: var(--ph); border-radius: calc(var(--u) * 11);
    /* the polished steel back shows as a thin rim around the front */
    background: linear-gradient(100deg, #8d9095 0%, #f3f4f5 18%, #a6a9ad 38%, #e9eaec 62%, #7e8186 100%);
    box-shadow:
      0 calc(var(--u) * 0.6) calc(var(--u) * 1) rgba(0, 0, 0, 0.3),
      0 calc(var(--u) * 6) calc(var(--u) * 12) calc(var(--u) * -2) rgba(0, 0, 0, 0.45),
      0 calc(var(--u) * 18) calc(var(--u) * 34) calc(var(--u) * -6) rgba(0, 0, 0, 0.5); }
  .face { position: absolute; inset: calc(var(--u) * 0.85); border-radius: calc(var(--u) * 10.2); overflow: hidden;
    background: linear-gradient(172deg, var(--front-a), var(--front-b));
    box-shadow: inset 0 calc(var(--u) * 0.25) calc(var(--u) * 0.2) rgba(255, 255, 255, 0.55), inset 0 calc(var(--u) * -0.3) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.18); }
  /* bead-blasted anodising: a fine tooth and a soft light from the upper left */
  .face::before { content: ""; position: absolute; inset: 0; background: url("/runtime/grain.png") 0 0 / 128px 128px; opacity: var(--tooth, 0.16); mix-blend-mode: overlay; }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255, 255, 255, var(--sheen, 0.35)) 0%, rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.08)); }

  /* the display window: black glass around the LCD */
  .window { position: absolute; left: calc(var(--u) * 7); top: calc(var(--u) * 8.2); width: calc(var(--u) * 86); height: calc(var(--u) * 65.5);
    border-radius: calc(var(--u) * 1.6); background: #08080a; z-index: 1;
    box-shadow: 0 0 0 calc(var(--u) * 0.18) rgba(0, 0, 0, 0.35), 0 calc(var(--u) * 0.2) 0 calc(var(--u) * 0.18) rgba(255, 255, 255, 0.35); }
  .lcd { position: absolute; left: calc(var(--u) * 2); top: calc(var(--u) * 1.75); width: calc(var(--s) * 320); height: calc(var(--s) * 240);
    background: #fff; overflow: hidden; color: #111; font-family: "Helvetica Neue", Helvetica, sans-serif; display: flex; flex-direction: column; }
  /* the screen on its own layer: the clock ticking each second repaints only it, not the shell's shadows */
  .sw-live .lcd { will-change: transform; }
  .glass { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
    background: linear-gradient(118deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 34%, rgba(255, 255, 255, 0) 34.5%, rgba(255, 255, 255, 0) 100%);
    box-shadow: inset 0 0 calc(var(--u) * 0.6) rgba(0, 0, 0, 0.6); }

  /* the status bar */
  .status { flex: none; height: calc(var(--s) * 20); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 calc(var(--s) * 7);
    background: linear-gradient(#fdfdfd, #e3e6ea 55%, #c9ced5); border-bottom: calc(var(--s) * 1) solid #8f98a4;
    font: 700 calc(var(--s) * 12.5) / 1 "Helvetica Neue", Helvetica, sans-serif; color: #111; letter-spacing: -0.01em; }
  .status .ttl { text-align: center; white-space: nowrap; }
  .status .play { justify-self: start; width: 0; height: 0; border-left: calc(var(--s) * 8) solid #2f6fd6; border-top: calc(var(--s) * 5) solid transparent; border-bottom: calc(var(--s) * 5) solid transparent;
    filter: drop-shadow(0 calc(var(--s) * 0.6) 0 rgba(255, 255, 255, 0.9)); }
  .paused-icon .status .play { width: calc(var(--s) * 7.5); height: calc(var(--s) * 10); border: 0; background: linear-gradient(90deg, #2f6fd6 0 35%, transparent 35% 65%, #2f6fd6 65%); }
  .status .batt { justify-self: end; position: relative; width: calc(var(--s) * 22); height: calc(var(--s) * 10.5); border: calc(var(--s) * 1.2) solid #3a3d42; border-radius: calc(var(--s) * 2);
    background: #f2f3f4; padding: calc(var(--s) * 1); box-sizing: border-box; }
  .status .batt::before { content: ""; display: block; height: 100%; width: 78%; border-radius: calc(var(--s) * 0.8); background: linear-gradient(#a8ef7c, #4cc22e 55%, #2f9d1a); }
  .status .batt::after { content: ""; position: absolute; right: calc(var(--s) * -3.4); top: 50%; width: calc(var(--s) * 2); height: calc(var(--s) * 4.5); margin-top: calc(var(--s) * -2.25);
    background: #3a3d42; border-radius: 0 calc(var(--s) * 1) calc(var(--s) * 1) 0; }

  .count { flex: none; font: 500 calc(var(--s) * 10.5) / 1 "Helvetica Neue", Helvetica, sans-serif; color: #555; padding: calc(var(--s) * 6) calc(var(--s) * 10) 0; height: calc(var(--s) * 10.5); }

  .main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: calc(var(--s) * 11); align-items: center;
    padding: 0 calc(var(--s) * 10) 0 calc(var(--s) * 12); }
  .art { position: relative; width: var(--art); height: var(--art); --art: calc(var(--s) * 92); }
  .art img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .front { box-shadow: 0 calc(var(--s) * 1.5) calc(var(--s) * 3) rgba(0, 0, 0, 0.28); }
  .art .refl { top: 100%; transform: scaleY(-1); opacity: 0.32;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 34%); mask-image: linear-gradient(to top, #000 0%, transparent 34%); }
  html:not(.param-reflection) .art .refl { display: none; }
  .info { min-width: 0; align-self: center; }
  .info > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .t { font: 700 calc(var(--s) * 13.5) / 1.25 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: -0.01em; }
  .info .a, .info .al { font: 400 calc(var(--s) * 12) / 1.3 "Helvetica Neue", Helvetica, sans-serif; color: #222; margin-top: calc(var(--s) * 3); }
  .info .al { color: #555; }
  .info .il { white-space: normal; font: italic 500 calc(var(--s) * 12) / 1.22 "Helvetica Neue", Helvetica, sans-serif; color: #1d5fbf; margin-top: calc(var(--s) * 4);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .info .t.marq { text-overflow: clip; }
  .info .t.marq span { display: inline-block; }
  .sw-live .info .t.marq span { animation: marq var(--marq-time, 10s) linear infinite; }
  @keyframes marq { 0%, 22% { transform: translateX(0); } 78%, 100% { transform: translateX(var(--marq)); } }

  /* the lyric, under the cover (with room for the reflection above it) */
  .lyric { flex: none; height: calc(var(--s) * 50); padding: 0 calc(var(--s) * 14); display: flex; align-items: center; justify-content: center; text-align: center; }
  .lyric div { font: 600 calc(var(--s) * var(--lfs, 14)) / 1.2 "Helvetica Neue", Helvetica, sans-serif; color: #111; letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lyric div.dim { color: #8a8f96; font-weight: 500; font-size: calc(var(--s) * 20); letter-spacing: 0.1em; }

  /* layouts: the lyric under the cover, in the album line, or none (focus, no lyrics) */
  .lay-below .main { padding-bottom: calc(var(--s) * 4); }
  .lay-below .al { display: none; }
  .lay-album .lyric, .lay-none .lyric { display: none; }
  .lay-album .art, .lay-none .art { --art: calc(var(--s) * 116); }
  .lay-none .il, .lay-below .il { display: none; }
  .lay-album .al { display: none; }

  /* the progress bar, with the times under each end */
  .pb { flex: none; padding: 0 calc(var(--s) * 12) calc(var(--s) * 7); }
  .pb progress-bar { height: calc(var(--s) * 9); border-radius: 0; background: linear-gradient(#ffffff, #e9ecf0); color: #3d7fe0;
    box-shadow: inset 0 0 0 calc(var(--s) * 1) #6d7b8d; }
  .pb progress-bar .fill { border-radius: 0; background: linear-gradient(#9cc4f6, #4a8ae6 50%, #2d6cd0 51%, #5b97ea); box-shadow: inset 0 0 0 calc(var(--s) * 1) #3a5f96; }
  .pb .times { display: flex; justify-content: space-between; margin-top: calc(var(--s) * 3.5); font: 700 calc(var(--s) * 10.5) / 1 "Helvetica Neue", Helvetica, sans-serif; color: #222;
    font-variant-numeric: tabular-nums; }

  /* the click wheel and its centre button */
  .wheel { position: absolute; left: 50%; top: calc(var(--u) * 121.5); width: calc(var(--u) * 63); height: calc(var(--u) * 63); margin: calc(var(--u) * -31.5) 0 0 calc(var(--u) * -31.5);
    border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--wheel-a), var(--wheel-b) 75%);
    box-shadow: inset 0 calc(var(--u) * 0.5) calc(var(--u) * 0.9) rgba(0, 0, 0, 0.16), inset 0 calc(var(--u) * -0.3) calc(var(--u) * 0.4) rgba(255, 255, 255, 0.5),
      0 0 0 calc(var(--u) * 0.15) var(--wheel-line), 0 calc(var(--u) * 0.25) 0 calc(var(--u) * 0.1) rgba(255, 255, 255, 0.32); z-index: 1; }
  .wheel .btn { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; margin: -20% 0 0 -20%; border-radius: 50%;
    background: linear-gradient(170deg, var(--button-a), var(--button-b));
    box-shadow: 0 0 0 calc(var(--u) * 0.15) var(--wheel-line), 0 calc(var(--u) * 0.35) calc(var(--u) * 0.7) rgba(0, 0, 0, 0.16), inset 0 calc(var(--u) * 0.2) calc(var(--u) * 0.15) rgba(255, 255, 255, 0.6); }
  .wheel svg { position: absolute; fill: var(--glyph); overflow: visible; }
  .wheel .menu { position: absolute; left: 50%; top: 10.5%; transform: translateX(-50%); font: 700 calc(var(--u) * 4) / 1 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0.05em; color: var(--glyph); }
  .wheel .prev { left: 9%; top: 50%; width: calc(var(--u) * 7); height: calc(var(--u) * 3.6); margin-top: calc(var(--u) * -1.8); }
  .wheel .next { right: 9%; top: 50%; width: calc(var(--u) * 7); height: calc(var(--u) * 3.6); margin-top: calc(var(--u) * -1.8); }
  .wheel .pp { left: 50%; bottom: 10%; width: calc(var(--u) * 7.4); height: calc(var(--u) * 3.6); margin-left: calc(var(--u) * -3.7); }

  /* the wheel works: scroll it for volume, click its edges to skip, its centre to play or pause */
  .wheel .vsense { position: absolute; inset: 5%; border-radius: 50%; }
  .wheel .zone { position: absolute; }
  .wheel .zprev { left: 2%; top: 30%; width: 22%; height: 40%; }
  .wheel .znext { right: 2%; top: 30%; width: 22%; height: 40%; }
  .wheel .zpp { left: 35%; bottom: 0; width: 30%; height: 26%; }
  .wheel .zbtn { left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%; }
  .pb .scrub { padding: calc(var(--s) * 4) 0; margin: calc(var(--s) * -4) 0; }

  /* portrait: the iPod on top, the title under it */
  @media (max-aspect-ratio: 1/1) {
    :root { --ph: min(58vh, 140vw); }
    .stage { grid-template-columns: auto; grid-template-rows: auto auto; justify-content: center; align-content: center; row-gap: 5vh; padding: 0 8vw; }
    .pod { justify-self: center; grid-row: 1; }
    .side { grid-row: 2; align-self: start; padding-bottom: 0; width: 84vw; text-align: center; }
    .kicker { justify-content: center; }
  }
</style>
</head>
<body>
  <div class="bg" data-cover-blur="110" data-cover-saturate="1.35"></div>
  <div class="shade"></div>
  <div class="sw-grain" data-show="params.grain"></div>

  <div class="stage">
    <div class="side">
      <div class="kicker"><i></i><span id="kick">Now playing</span></div>
      <fit-text class="big" id="big" max-lines="3" min="4vmin" max="12vmin" data-bind="track.title"></fit-text>
      <div class="by"><div data-bind="track.artist"></div><div class="al" data-bind="track.album"></div></div>
    </div>

    <div class="pod">
      <div class="face">
        <div class="window">
          <div class="lcd" id="lcd">
            <div class="status"><i class="play"></i><span class="ttl">Now Playing</span><i class="batt"></i></div>
            <div class="count" id="count"></div>
            <div class="main">
              <div class="art"><img class="front" data-src="track.cover" alt=""><img class="refl" data-src="track.cover" alt=""></div>
              <div class="info">
                <div class="t" id="t"><span data-bind="track.title"></span></div>
                <div class="a" data-bind="track.artist"></div>
                <div class="al" data-bind="track.album"></div>
                <div class="il" id="il" data-lyrics></div>
              </div>
            </div>
            <div class="lyric" data-lyrics><div id="ly" data-animate></div></div>
            <div class="pb"><div class="scrub" data-control="seek" data-show="params.controls"><progress-bar></progress-bar></div><div class="times"><span data-bind="track.elapsed"></span><span data-bind="track.remaining"></span></div></div>
          </div>
          <div class="glass"></div>
        </div>
        <div class="wheel">
          <div class="menu">MENU</div>
          <svg class="prev" viewBox="0 0 28 14"><rect x="0" y="0" width="2.6" height="14"/><path d="M14 0v14L2.6 7zM26 0v14L14.6 7z"/></svg>
          <svg class="next" viewBox="0 0 28 14"><path d="M0 0v14l11.4-7zM12 0v14l11.4-7z"/><rect x="25.4" y="0" width="2.6" height="14"/></svg>
          <svg class="pp" viewBox="0 0 30 14"><path d="M0 0v14l11.4-7z"/><rect x="17" y="0" width="4" height="14"/><rect x="24.5" y="0" width="4" height="14"/></svg>
          <div class="btn"></div>
          <div class="vsense" data-control="volume" data-show="params.controls">
            <div class="zone zprev" data-control="previous" role="button" aria-label="Previous"></div>
            <div class="zone znext" data-control="next" role="button" aria-label="Next"></div>
            <div class="zone zpp" data-control="playPause" role="button" aria-label="Play or pause"></div>
            <div class="zone zbtn" data-control="playPause" role="button" aria-label="Play or pause"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const rootStyle = document.documentElement.style;

    // ---------- colour helpers ----------
    const rgbOf = (h) => { h = String(h || "#888").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function hsl(hex) {
      const [r, g, b] = rgbOf(hex).map((v) => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
      let h = 0, s = 0;
      if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
      return [h, s, l];
    }
    const H = (h, s, l) => `hsl(${h.toFixed(1)} ${(Math.max(0, Math.min(1, s)) * 100).toFixed(1)}% ${(Math.max(0, Math.min(1, l)) * 100).toFixed(1)}%)`;

    const SHELLS = {
      silver: { "--front-a": "#e8e9ea", "--front-b": "#c3c5c8", "--wheel-a": "#f5f5f3", "--wheel-b": "#dadad8", "--button-a": "#fbfbfa", "--button-b": "#e0e0de",
        "--glyph": "#a4a6a9", "--wheel-line": "rgba(0,0,0,0.1)", "--tooth": 0.16, "--sheen": 0.35 },
      white: { "--front-a": "#fdfdfc", "--front-b": "#ecece9", "--wheel-a": "#fdfdfc", "--wheel-b": "#e2e2df", "--button-a": "#ffffff", "--button-b": "#ecece9",
        "--glyph": "#ababa8", "--wheel-line": "rgba(0,0,0,0.13)", "--tooth": 0.04, "--sheen": 0.6 },
      black: { "--front-a": "#333336", "--front-b": "#121214", "--wheel-a": "#3a3a3d", "--wheel-b": "#202022", "--button-a": "#3c3c3f", "--button-b": "#232325",
        "--glyph": "#9a9ba0", "--wheel-line": "rgba(0,0,0,0.5)", "--tooth": 0.22, "--sheen": 0.14 },
    };
    /** Anodised in the cover's colour: its most colourful hue, toned down the way dyed aluminium is. */
    function coverShell(ctx) {
      const pal = [ctx.colors.vibrant, ...(ctx.colors.palette || [])].filter(Boolean);
      let best = pal[0] || "#7a8696", bs = -1;
      for (const c of pal) { const [, s, l] = hsl(c); const score = s * (1 - Math.abs(l - 0.5) * 1.4); if (score > bs) { bs = score; best = c; } }
      const [h, s0] = hsl(best), s = Math.min(0.55, Math.max(0.12, s0 * 0.7));
      return { "--front-a": H(h, s, 0.6), "--front-b": H(h, s * 1.05, 0.42), "--wheel-a": H(h, s * 0.35, 0.93), "--wheel-b": H(h, s * 0.4, 0.83),
        "--button-a": H(h, s * 0.3, 0.97), "--button-b": H(h, s * 0.35, 0.87), "--glyph": H(h, s * 0.5, 0.62), "--wheel-line": "rgba(0,0,0,0.12)",
        "--tooth": 0.2, "--sheen": 0.3 };
    }

    // ---------- the screen's text ----------
    function lyricState(ctx) {
      const L = ctx.lyrics;
      if (ctx.focus || !L.hasLyrics) return null;
      if (L.index < 0) return { text: "• • •", dim: true };
      if (L.isInstrumental) return { text: "♪", dim: true };
      return { text: L.current, dim: false };
    }

    Wallpaper.on("render", (ctx) => {
      const shell = ctx.params.shell === "cover" ? coverShell(ctx) : SHELLS[ctx.params.shell] || SHELLS.silver;
      for (const k in shell) rootStyle.setProperty(k, shell[k]);

      const L = ctx.lyrics, st = lyricState(ctx), lcd = $("lcd");
      const lay = !st ? "none" : ctx.params.lyricPlace === "album" ? "album" : "below";
      lcd.className = "lcd lay-" + lay;
      document.documentElement.classList.toggle("paused-icon", ctx.track.isPlaying === false);
      const text = st ? st.text : "";
      if ($("ly").textContent !== text) $("ly").textContent = text;
      $("ly").className = st && st.dim ? "dim" : "";
      // longer lines step down a size so three rows hold them
      const n = text.length;
      $("ly").style.setProperty("--lfs", n > 90 ? 11 : n > 64 ? 12.5 : 14);
      if ($("il").textContent !== text) $("il").textContent = text;

      const sung = L.lines.filter((l) => l.text.trim()).length;
      const at = L.lines.slice(0, L.index + 1).filter((l) => l.text.trim()).length;
      $("count").textContent = !st ? "" : L.index < 0 ? "Intro" : at + " of " + sung;
      $("kick").textContent = ctx.track.isPlaying === false ? "Paused" : "Now playing";

      const tall = innerWidth < innerHeight;
      $("big").setAttribute("max", tall ? "10vmin" : "12vmin");
    });

    // a title too long for the little screen scrolls across it, like the iPod did (live); stills end in an ellipsis
    Wallpaper.on("layout", () => {
      const t = $("t"), over = t.firstElementChild.getBoundingClientRect().width - t.clientWidth;
      const on = over > 2 && Wallpaper.live;
      // set only on change: re-adding the class or a new distance would restart the scroll on every line
      if (t.classList.contains("marq") !== on) t.classList.toggle("marq", on);
      const dist = -(Math.ceil(over) + 6) + "px";
      if (on && t.style.getPropertyValue("--marq") !== dist) {
        t.style.setProperty("--marq", dist);
        t.style.setProperty("--marq-time", Math.max(8, over / 18 + 6).toFixed(1) + "s");
      }
    });
    addEventListener("resize", () => Wallpaper.refresh());
  </script>
</body>
</html>
