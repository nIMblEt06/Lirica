<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  body { color: #fff; background: #050506; font-family: -apple-system, "SF Pro Text", sans-serif; }
  .backdrop { position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(8vmin) saturate(1.3) brightness(0.5); }
  .wash { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 92%, var(--param-tint) 0%, transparent 70%); opacity: 0.6; }
  .lyric {
    position: absolute; left: 50%; bottom: 30vmin; transform: translateX(-50%); width: 80vmin; text-align: center;
    font-family: var(--param-font); font-size: 3.6vmin; line-height: 1.3; text-shadow: 0 0.3vmin 2vmin rgba(0, 0, 0, 0.5);
  }
  .island {
    position: absolute; left: 50%; bottom: 9vmin; transform: translateX(-50%);
    width: 62vmin; box-sizing: border-box; padding: 1.6vmin 2.6vmin 2.4vmin 1.6vmin;
    display: flex; align-items: center; gap: 2.4vmin;
    border-radius: 9vmin; background: rgba(14, 14, 16, 0.78);
    box-shadow: inset 0 0 0 0.15vmin rgba(255, 255, 255, 0.12), 0 2.5vmin 6vmin rgba(0, 0, 0, 0.45);
  }
  .cover { width: 8vmin; height: 8vmin; border-radius: 4.5vmin; object-fit: cover; flex: none; }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 2.1vmin; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 1.6vmin; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.3vmin; }
  .ctls { display: flex; align-items: center; gap: 1.6vmin; flex: none; }
  .ctl { width: 5.6vmin; height: 5.6vmin; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); }
  .ctl svg { width: 2.6vmin; height: 2.6vmin; fill: #fff; display: block; }
  .ctl.pp { width: 6.8vmin; height: 6.8vmin; background: #fff; }
  .ctl.pp svg { width: 2.9vmin; height: 2.9vmin; fill: #111; }
  .ctl.pp .i-play, .ctl.pp .i-pause { display: none; }
  html:not(.is-playing) .ctl.pp .i-play { display: block; }
  html.is-playing .ctl.pp .i-pause { display: block; }
  .seek {
    position: absolute; left: 4.5vmin; right: 4.5vmin; bottom: 1vmin; height: 0.4vmin; border-radius: 0.4vmin;
    color: #fff; background: rgba(255, 255, 255, 0.18);
  }
  .sw-grain { opacity: 0.1; }
</style>
</head>
<body>
  <img class="backdrop" data-src="track.cover" alt="">
  <div class="wash"></div>
  <div class="lyric" data-show="lyrics.hasLyrics" data-bind="lyrics.current"></div>
  <div class="island" data-control="volume" data-show="params.controls">
    <img class="cover" data-src="track.cover" alt="">
    <div class="info">
      <div class="title" data-bind="track.title"></div>
      <div class="artist" data-bind="track.artist"></div>
    </div>
    <div class="ctls" data-show="params.controls">
      <div class="ctl" data-control="previous" role="button" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 5h2.6v14H6zM20 5v14L9.3 12z"/></svg>
      </div>
      <div class="ctl pp" data-control="playPause" role="button" aria-label="Play or pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.2v15.6L20 12z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.8 4.5h3.5v15H6.8zM13.7 4.5h3.5v15h-3.5z"/></svg>
      </div>
      <div class="ctl" data-control="next" role="button" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M15.4 5H18v14h-2.6zM4 5v14l10.7-7z"/></svg>
      </div>
    </div>
    <progress-bar class="seek" data-control="seek" data-show="params.controls"></progress-bar>
  </div>
  <div class="sw-grain" data-show="params.grain"></div>
</body>
</html>
