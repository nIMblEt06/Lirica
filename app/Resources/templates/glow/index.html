<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  body { background: var(--dark); color: #fff; font-family: var(--param-font); }
  /* soft blobs are radial gradients, not a live blur, so moving them is nearly free */
  .mesh { position: absolute; inset: -20%; }
  .mesh i { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; margin: -47.5vmax 0 0 -47.5vmax; will-change: transform; }
  .mesh-dim { position: absolute; inset: 0; background: #000; opacity: calc(1 - var(--param-brightness)); }
  .mesh i:nth-child(1) { left: 18%; top: 22%; background: radial-gradient(closest-side, var(--p0), transparent); }
  .mesh i:nth-child(2) { left: 84%; top: 18%; background: radial-gradient(closest-side, var(--vibrant), transparent); }
  .mesh i:nth-child(3) { left: 70%; top: 86%; background: radial-gradient(closest-side, var(--p2), transparent); }
  .mesh i:nth-child(4) { left: 20%; top: 88%; background: radial-gradient(closest-side, var(--p3), transparent); }
  .mesh i:nth-child(5) { left: 50%; top: 50%; background: radial-gradient(closest-side, var(--p1), transparent); width: 65vmax; height: 65vmax; margin: -32.5vmax 0 0 -32.5vmax; }

  .sw-live.param-drift .mesh i { animation: drift 26s ease-in-out infinite alternate; }
  .sw-live.param-drift .mesh i:nth-child(2) { animation-duration: 31s; animation-delay: -8s; }
  .sw-live.param-drift .mesh i:nth-child(3) { animation-duration: 23s; animation-delay: -15s; }
  .sw-live.param-drift .mesh i:nth-child(4) { animation-duration: 35s; animation-delay: -4s; }
  .sw-live.param-drift .mesh i:nth-child(5) { animation-duration: 29s; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(14vmax, -10vmax) scale(1.25); } }
  lyrics-block.karaoke { --karaoke-on: #fff; --karaoke-off: rgba(255, 255, 255, 0.42); }
  .layout { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 7vw; gap: 6.5vw; }
  .left { width: var(--param-coverSize); flex: none; }
  .cover { width: 100%; aspect-ratio: 1; border-radius: 1.4vmin; object-fit: cover; box-shadow: 0 2vmin 7vmin rgba(0, 0, 0, 0.45); }
  .title { font-weight: 700; font-size: 3.2vmin; margin-top: 4vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-weight: 500; font-size: 2.4vmin; opacity: 0.62; margin-top: 0.8vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  progress-bar { margin-top: 3vmin; color: rgba(255, 255, 255, 0.85); background: rgba(255, 255, 255, 0.22); }
  /* playback controls, Apple Music style: drag the bar to seek, click the transport to skip */
  .scrub { margin-top: 3vmin; padding: 1.7vmin 0; margin-bottom: 0.4vmin; }
  .scrub progress-bar { margin-top: 0; }
  .transport { display: flex; align-items: center; justify-content: center; gap: 5.4vmin; margin-top: 1.6vmin; opacity: 0.52; transition: opacity 0.3s ease; }
  .transport:hover { opacity: 1; }
  .ctl { display: grid; place-items: center; width: 3.4vmin; height: 3.4vmin; color: #fff; }
  .ctl[data-control="playPause"] { width: 4.8vmin; height: 4.8vmin; }
  .ctl svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .ctl .i-play, .ctl .i-pause { display: none; }
  html:not(.is-playing) .ctl .i-play { display: block; }
  html.is-playing .ctl .i-pause { display: block; }

  lyrics-block { flex: 1; height: 82vh; max-width: 110vmin; }
  lyrics-block .line {
    font-weight: var(--param-weight); font-size: var(--param-lyricSize); line-height: 1.12;
    margin: 0 0 3vmin; opacity: calc(0.46 * pow(0.72, var(--dist) - 1));
  }
  lyrics-block .past { opacity: calc(0.22 * pow(0.6, var(--dist) - 1)); }
  lyrics-block .current { opacity: 1; }
  .empty { flex: 1; font-size: 4vmin; font-weight: 600; opacity: 0.45; }
</style>
</head>
<body>
  <div class="mesh"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="mesh-dim"></div>
  <div class="sw-grain" data-show="params.grain"></div>
  <div class="layout">
    <div class="left">
      <img class="cover" data-src="track.cover" alt="">
      <div class="title" data-bind="track.title"></div>
      <div class="artist" data-bind="track.artist"></div>
      <div class="scrub" data-control="seek" data-show="params.showProgress">
        <progress-bar></progress-bar>
      </div>
      <div class="transport" data-show="params.controls">
        <div class="ctl" data-control="previous" role="button" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 5h2.6v14H6zM20 5v14L9.3 12z"/></svg>
        </div>
        <div class="ctl" data-control="playPause" role="button" aria-label="Play or pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.2v15.6L20 12z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.8 4.5h3.5v15H6.8zM13.7 4.5h3.5v15h-3.5z"/></svg>
        </div>
        <div class="ctl" data-control="next" role="button" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M15.4 5H18v14h-2.6zM4 5v14l10.7-7z"/></svg>
        </div>
      </div>
    </div>
    <lyrics-block layout="center" data-attr-class="params.karaoke|kclass" data-attr-duet="params.duet" data-attr-translations="params.translations" data-attr-before="params.linesBefore" data-attr-after="params.linesAfter"></lyrics-block>
    <div class="empty" data-show="!lyrics.hasLyrics">No lyrics found</div>
  </div>
</body>
</html>
